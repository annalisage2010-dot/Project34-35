<!DOCTYPE html>
<html>
<head>
  <title>AGI Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
<h1 id="app-title">AGI bank</h1>

    <div id="balance-box">
      <p id="balance-label">Remaining balance</p>
      <p id="balance">4 LAKHS</p>
    </div>

    <div id="entry-box">
      <label id="amount-label" for="amount">Enter amount</label>
      <input type="number" id="amount" placeholder="0">
    </div>

    <div id="button-box">
      <button class="action credit" id="credit-btn">Credit</button>
      <button class="action debit" id="debit-btn">Debit</button>
    </div>

    <p id="message"></p>
    <p id="note">Terms and conditions apply</p>

  </div>

</body>
</html>
